<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <div class="popup">
      <button id="power" class="power" type="button" aria-pressed="true"
              title="Toggle voice control">
        <svg viewBox="0 0 24 24" width="34" height="34" aria-hidden="true">
          <path d="M12 3v8" />
          <path d="M7.2 6.4a7 7 0 1 0 9.6 0" />
        </svg>
      </button>
      <button id="deafen" class="deafen" type="button" aria-pressed="false"
              title="Deafen: ignore everything except the wake phrase">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
          <path d="M6 8.5a6.5 6.5 0 1 1 13 0c0 6-6 6-6 10a3.5 3.5 0 1 1-7 0" />
          <path d="M4 4l16 16" />
        </svg>
        <span>Deafen</span>
      </button>
      <div id="status" class="status">Listening</div>
    </div>
    <script src="popup.js"></script>
  </body>
</html>
